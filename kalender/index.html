<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Familjekalendern</title>
<meta name="theme-color" content="#FF5A36">
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalendern">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Caveat:wght@600;700&family=Figtree:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EF;--surface:#FFFFFF;--surface-2:#EFEBE3;--text:#1F2328;--muted:#6B6F76;--line:#E4DFD4;
  --accent:#1F5F5B;--accent-ink:#FFFFFF;--kids:#E3F0EC;--kids-ink:#1F5F5B;--danger:#C0392B;--season:var(--accent);--ink:var(--line);--f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;--f-display:var(--f-body);--wx-sun:#C98500;--wx-rain:#2F6FC4;--wx-storm:#7C4DBA;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141618;--surface:#1D2024;--surface-2:#272B30;--text:#ECEDEE;--muted:#9BA1A6;--line:#30353B;
    --accent:#6CC3B8;--accent-ink:#0E1A19;--kids:#1B2E2B;--kids-ink:#8FD6CB;--danger:#F07167;--wx-sun:#F2C14E;--wx-rain:#7FB0F0;--wx-storm:#B79CF0;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#141618;--surface:#1D2024;--surface-2:#272B30;--text:#ECEDEE;--muted:#9BA1A6;--line:#30353B;
  --accent:#6CC3B8;--accent-ink:#0E1A19;--kids:#1B2E2B;--kids-ink:#8FD6CB;--danger:#F07167;--wx-sun:#F2C14E;--wx-rain:#7FB0F0;--wx-storm:#B79CF0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--f-body);background:radial-gradient(1100px 560px at 100% -10%,color-mix(in srgb,var(--season) 16%,transparent),transparent 70%) no-repeat fixed,var(--bg);color:var(--text);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
svg{display:block}
#app{max-width:1280px;margin:0 auto;padding-block:16px 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Topp */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;margin-right:auto;letter-spacing:-.01em}
.logo{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.tools{display:flex;gap:8px;align-items:center}
.nav{display:flex;align-items:center;flex-wrap:wrap;gap:6px;width:100%;margin:14px 0 10px}
.nav h1{font-size:22px;margin:0 0 0 10px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.nav h1 small{display:block;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.icon{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;flex:none}
.btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:transparent;background:transparent;padding:0 6px}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;height:32px;padding:0 13px;border-radius:8px;font-weight:700;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* Filter */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 4px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.fchip.all{padding:0 12px}
.fchip[aria-pressed="true"]{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.av{width:22px;height:22px;border-radius:50%;background:var(--pc);color:#fff;display:inline-grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.av.sm{width:18px;height:18px;font-size:10px}
.av.xs{width:15px;height:15px;font-size:8px}
.all-tag{font-size:11px;font-weight:700;color:var(--muted)}

.notice{background:var(--surface-2);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--muted);margin-bottom:14px}

/* Barnvecka */
.kids-banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;margin-bottom:12px;font-size:14px;background:var(--surface);border:1px dashed var(--line);color:var(--muted)}
.kids-banner.on{background:var(--kids);border:1px solid transparent;color:var(--kids-ink)}
.kids-banner .avs{display:flex}
.kids-banner .avs .av{margin-left:-4px;box-shadow:0 0 0 2px var(--kids)}
.kids-banner .avs .av:first-child{margin-left:0}
.kids-banner:not(.on) .av{filter:grayscale(1);opacity:.5;box-shadow:0 0 0 2px var(--surface)}

/* Aktivitetskort */
.ev{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:0;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 15%,var(--surface));border-radius:8px;padding:6px 8px 7px}
.ev:hover{background:color-mix(in srgb,var(--c) 24%,var(--surface))}
.ev-t{font-weight:700;font-size:14px;line-height:1.25;word-break:break-word}
.ev-m{font-size:12px;color:var(--muted);font-weight:500}
.ev-p{display:flex;align-items:center;margin-top:3px;padding-left:4px}
.ev-p .av{margin-left:-4px;box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 15%,var(--surface))}
.ev-note{font-size:13px;color:var(--muted);margin-top:2px}
.rep{opacity:.8}

/* Dag */
.dayview{display:grid;gap:8px;max-width:760px}
.dslot{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.dslot .tm{font-weight:800;font-size:15px;padding-top:6px}
.dslot .tm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.dslot .ev{padding:8px 10px}
.add-row{display:flex;align-items:center;justify-content:center;gap:6px;height:48px;border:1px dashed var(--line);border-radius:14px;background:transparent;color:var(--muted);font-weight:700}
.add-row:hover{border-color:var(--accent);color:var(--accent)}
.empty{color:var(--muted);font-size:13px;margin:4px 2px}
.empty-big{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}

/* Vecka */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border-radius:14px;border:1px solid var(--line);min-height:300px;display:flex;flex-direction:column}
.day-h{display:flex;align-items:center;gap:6px;padding:10px 8px 8px 10px}
.day-h .go{border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column}
.dname{font-weight:800}
.dnum{color:var(--muted);font-size:13px}
.day.is-today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day.is-today .dname{color:var(--accent)}
.add-day{margin-left:auto;width:28px;height:28px;border-radius:8px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;opacity:0;transition:opacity .15s}
.day:hover .add-day,.add-day:focus-visible{opacity:1}
.add-day:hover{background:var(--surface-2);color:var(--text)}
@media (hover:none){.add-day{opacity:1}}
.evs{display:flex;flex-direction:column;gap:6px;padding:0 8px 10px}

/* Månad */
.mscroll{display:flex;flex-direction:column;gap:22px;max-width:900px}
.msec{display:flex;flex-direction:column;gap:8px}
.msent{height:1px}
.mhead{margin:0;padding:6px 2px 2px;font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:-.02em}
.msec,.mday{scroll-margin-top:calc(var(--bar-h,120px) + 8px)}
.mhead span{color:var(--muted);font-weight:600}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.mlist{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#view > .legend:first-child{margin:0 0 4px}
.mwk{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2);border-top:1px solid var(--line)}
.mwk:first-child{border-top:0}
.mwk.kids{background:var(--kids);color:var(--kids-ink)}
.mwk .avs{display:flex;gap:2px}
.mwk .kn{text-transform:none;letter-spacing:0;font-weight:600}
.mday{display:grid;grid-template-columns:64px minmax(0,1fr) auto 30px;gap:10px;align-items:center;padding:6px 8px 6px 14px;border-top:1px solid var(--line);min-height:44px;cursor:pointer}
.mday:hover{background:color-mix(in srgb,var(--surface-2) 60%,var(--surface))}
.mday.kids{background:color-mix(in srgb,var(--kids) 35%,var(--surface))}
.mday.kids:hover{background:color-mix(in srgb,var(--kids) 65%,var(--surface))}
.mday.is-today{box-shadow:inset 3px 0 0 var(--accent)}
.mdate{display:flex;align-items:baseline;gap:8px}
.mdate .dn{font-size:17px;font-weight:800;min-width:22px;text-align:right;font-variant-numeric:tabular-nums}
.mdate .dw{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.mday.sun .dn,.mday.sun .dw{color:var(--danger)}
.mday.is-today .dn,.mday.is-today .dw{color:var(--accent)}
.mitems{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.mev{display:inline-flex;align-items:center;gap:6px;max-width:100%;text-align:left;border:0;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 15%,var(--surface));border-radius:6px;padding:4px 8px;font-size:13px;font-weight:600}
.mev:hover{background:color-mix(in srgb,var(--c) 26%,var(--surface))}
.mev .mt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mev b{font-weight:800}
.mev .avs{display:flex;flex:none}
.mev .avs .av{margin-left:-3px;box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 15%,var(--surface))}
.mday:hover .add-day{opacity:1}

/* År */
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ymonth{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px 10px}
.ymonth h3{margin:0 0 8px 4px;font-size:15px;font-weight:800;text-transform:capitalize}
.ymonth h3 button{border:0;background:transparent;padding:0;font-weight:800}
.ymonth h3 button:hover{color:var(--accent)}
.yg{display:grid;grid-template-columns:22px repeat(7,1fr);gap:1px}
.yg .yh{font-size:10px;font-weight:800;color:var(--muted);text-align:center;padding-bottom:3px}
.yg .yw{font-size:10px;color:var(--muted);display:grid;place-items:center;border-radius:4px;font-weight:700}
.yg .yw.kids{background:var(--kids);color:var(--kids-ink)}
.yd{border:0;background:transparent;padding:3px 0 4px;border-radius:6px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:30px}
.yd:hover{background:var(--surface-2)}
.yd.kids{background:color-mix(in srgb,var(--kids) 55%,var(--surface))}
.yd.out{visibility:hidden}
.yd.is-today span{background:var(--accent);color:var(--accent-ink);border-radius:99px;width:20px;height:20px;display:grid;place-items:center}
.ydots{display:flex;gap:2px;height:4px}
.ydots i{width:4px;height:4px;border-radius:50%;background:var(--c)}

/* Väder */
.wx{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums}
.wx b{font-weight:800}
.wx .lo{color:var(--muted);font-weight:600}
.wxi{color:var(--muted);flex:none}
.wxi-sun,.wxi-partly{color:var(--wx-sun)}
.wxi-rain,.wxi-snow{color:var(--wx-rain)}
.wxi-storm{color:var(--wx-storm)}
.day-h .wx{margin-left:auto}
.day-h .wx + .add-day{margin-left:0}
.mwx{display:flex;justify-content:flex-end}
.wxcard{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:12px;max-width:760px}
.wxt{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.wxt b{font-size:24px;font-weight:800;line-height:1}
.wxt span{font-size:16px;color:var(--muted);font-weight:600}
.wxd{font-size:13px;color:var(--muted);margin-top:2px}
.legend .src{margin-left:auto}
.legend a{color:inherit}

/* Förklaring */
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;background:var(--c)}
.legend i.kidsw{background:var(--kids);border:1px solid var(--kids-ink)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(15,18,20,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#dialog{z-index:55}
.sheet{background:var(--surface);border-radius:18px;width:100%;max-width:560px;max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet.dlg{max-width:380px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 6px}
.sheet-h h2{margin:0;font-size:19px;font-weight:800}
.sheet-b{padding:8px 18px 14px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet-b p{margin:0}
.sheet-b h3{margin:8px 0 -4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sheet-f{display:flex;gap:8px;align-items:center;padding:12px 18px 16px;border-top:1px solid var(--line)}
.dlg-f{display:flex;flex-direction:column;gap:8px;padding:4px 18px 18px}
.spacer{flex:1}
.ver{font-size:12px;color:var(--muted);margin:4px 0 0}
.info{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 12px}
@media (max-width:600px){
  .overlay{align-items:flex-end;padding:0}
  .sheet{border-radius:18px 18px 0 0;max-height:92dvh;max-width:none}
  .sheet-f{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:700}
.field em{font-style:normal;font-weight:400;color:var(--muted)}
input:not([type=checkbox]):not([type=radio]):not([type=color]),select,textarea{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface);width:100%;min-width:0}
textarea{height:auto;padding:10px 12px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);font-size:14px;font-weight:600;cursor:pointer;user-select:none}
.chip input:focus-visible+span{outline:2px solid var(--accent)}
.chip.cat i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip.cat input:checked+span{background:color-mix(in srgb,var(--c) 20%,var(--surface));border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.chip.person span{padding-left:5px}
.chip.person input:checked+span{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.chip.day span{width:44px;justify-content:center;padding:0}
.chip.day input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.switch{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:14px;cursor:pointer;width:max-content;position:relative}
.switch input{position:absolute;opacity:0}
.switch span{width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:.15s}
.switch span::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(16px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.srow{display:flex;align-items:center;gap:8px}
.srow input[type=color]{width:42px;height:42px;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface);flex:none;cursor:pointer}
.mini{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;color:var(--muted);cursor:pointer}

/* Lås */
.lock{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:60;padding:24px}
.lock form{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;text-align:center;box-shadow:var(--shadow)}
.lock .logo{margin:0 auto;width:48px;height:48px;border-radius:14px}
.lock h2{margin:0;font-size:20px}
.lock p{margin:0;color:var(--muted);font-size:14px}
.lock input{text-align:center;font-size:22px!important;letter-spacing:.3em;height:52px!important}
.lock .btn{height:46px}
.err{color:var(--danger);font-size:14px;min-height:1.2em}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:70}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fab{display:none}

.nav h1{min-width:0;flex:1}
.srow{flex-wrap:wrap}
.srow input:not([type=color]){flex:1;min-width:140px;width:auto}
.filters .fchip{flex:none}
.mitems .mev{min-width:0}

@media (min-width:1600px){
  #app{max-width:1480px}
}
@media (max-width:1100px){
  .week{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .day{min-height:180px}
}
@media (max-width:560px){
  .week{grid-template-columns:1fr}
  .day{min-height:0}
  .day-h .go{flex-direction:row;align-items:baseline;gap:8px}
}
@media (max-width:700px){
  #app{padding-block:12px 100px}
  .tools{width:100%}
  .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .filters::-webkit-scrollbar{display:none}
  .chip.day{flex:1;min-width:0}
  .chip.day span{width:100%}
  .sheet-h,.sheet-b,.sheet-f,.dlg-f{padding-left:16px;padding-right:16px}
  .ymonth{padding:10px 8px 8px}
  .seg{flex:1}
  .seg button{flex:1;padding:0 6px}
  #addBtn{display:none}
  .fab{display:grid;place-items:center;position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;background:var(--accent);color:var(--accent-ink);border:0;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:40}
  .nav h1{font-size:19px}

<script>
(() => {
'use strict';

/* ---------- Hjälpfunktioner ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dow = d => (d.getDay() + 6) % 7 + 1; // 1 = mån … 7 = sön
const noon = d => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12);
const startOfWeek = d => addDays(noon(d), 1 - dow(d));
const todayStr = () => ymd(new Date());
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);

const MONTHS = ['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];
const MON_S = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
const DAYS = ['Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag','Söndag'];
const DAYS_S = ['Mån','Tis','Ons','Tor','Fre','Lör','Sön'];
const WEEKLY = ['weekly','biweekly','kidsweeks','otherweeks'];

function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 864e5 + 1) / 7);
}
const fmtDate = ds => { const d = parse(ds); return `${DAYS[dow(d) - 1].toLowerCase()} ${d.getDate()} ${MON_S[d.getMonth()]}`; };

const svg = p => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  prev: svg('<path d="M15 18l-6-6 6-6"/>'),
  next: svg('<path d="M9 18l6-6-6-6"/>'),

}
function legend() {

/* ---------- Vyer ---------- */
function renderDay() {
  const d = ui.cursor, ds = ymd(d);
  const evs = eventsOn(ds, d);
  let h = holTag(ds) + wxCard(ds) + kidsBanner(d) + '<div class="dayview">';
  if (!evs.length) h += '<div class="empty-big">Inget inplanerat den här dagen.</div>';
  for (const e of evs) {
    const timed = !(e.allDay || isMulti(e) || !e.time);
    h += `<div class="dslot"><div class="tm">${timed ? e.time + (e.endTime ? `<small>till ${e.endTime}</small>` : '') : '<small>Heldag</small>'}</div>${pill(e, ds, true)}</div>`;
  }
  h += `<button class="add-row" data-add="${ds}">${I.plus} Lägg till aktivitet</button></div>`;
  return h;

function renderWeek() {
  const ws = startOfWeek(ui.cursor), t = todayStr();
  let h = kidsBanner(ws) + '<div class="week">';
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i), ds = ymd(d), evs = eventsOn(ds, d), hol = holOn(ds);
    h += `<section class="day ${ds === t ? 'is-today' : ''} ${hol && hol.red ? 'red' : ''} ${i === 6 ? 'sun' : ''}">
      <header class="day-h"><button class="go" data-goto="${ds}"><span class="dname">${DAYS[i]}</span><span class="dnum">${d.getDate()} ${MON_S[d.getMonth()]}</span>${hol ? `<span class="hol">${esc(hol.name)}</span>` : ''}</button>${wxChip(ds)}
      <button class="add-day" data-add="${ds}" aria-label="Lägg till på ${DAYS[i].toLowerCase()}">${I.plus}</button></header>
      <div class="evs">${evs.length ? evs.map(e => pill(e, ds)).join('') : '<p class="empty">Inget inplanerat</p>'}</div></section>`;
  }
  return h + '</div>';
}

const mIdx = d => d.getFullYear() * 12 + d.getMonth();
const fromIdx = i => new Date(Math.floor(i / 12), i % 12, 1, 12);
function monthBlock(idx) {
  const first = fromIdx(idx), y = first.getFullYear(), m = first.getMonth(), t = todayStr();
  const days = new Date(y, m + 1, 0, 12).getDate();
  const kids = kidsList();
  let h = `<section class="msec" data-mi="${idx}"><h2 class="mhead">${cap(MONTHS[m])} <span>${y}</span></h2><div class="mlist">`;
  for (let n = 1; n <= days; n++) {
    const d = new Date(y, m, n, 12), ds = ymd(d), wd = dow(d), kw = isKidsWeek(d);
    if (n === 1 || wd === 1) {
      h += `<div class="mwk ${kw ? 'kids' : ''}">Vecka ${isoWeek(d)}${kw ? `<span class="avs">${kids.map(p => avatar(p, 'xs')).join('')}</span><span class="kn">${esc(kidsNames())}</span>` : ''}</div>`;
    }
    const evs = eventsOn(ds, d), hol = holOn(ds);
    h += `<div class="mday ${kw ? 'kids' : ''} ${wd === 7 || (hol && hol.red) ? 'sun' : ''} ${ds === t ? 'is-today' : ''}" data-goto="${ds}">
      <div class="mdate"><span class="dn">${n}</span><span class="dw">${DAYS_S[wd - 1]}</span></div>
      <div class="mitems">${hol ? `<span class="hol">${esc(hol.name)}</span>` : ''}${evs.map(e => mpill(e, ds)).join('')}</div>
      <div class="mwx">${wxChip(ds, true)}</div>
      <button class="add-day" data-add="${ds}" aria-label="Lägg till ${n} ${MONTHS[m]}">${I.plus}</button></div>`;
  }
  return h + '</div></section>';
}
function ensureRange(idx) {
  if (!ui.mRange) ui.mRange = { from: idx - 3, to: idx + 6 };
  ui.mRange.from = Math.min(ui.mRange.from, idx - 1);
  ui.mRange.to = Math.max(ui.mRange.to, idx + 1);
}
function renderMonth() {
  const c = mIdx(ui.cursor);
  if (!ui.mRange) { ensureRange(c); ui.mScroll = { idx: c }; }
  let h = '<div class="mscroll"><div class="msent" data-sent="top"></div>';
  for (let i = ui.mRange.from; i <= ui.mRange.to; i++) h += monthBlock(i);
  return h + '<div class="msent" data-sent="bottom"></div></div>';
}
let mObs = null, mBusy = false;
function afterMonthRender() {
  if (mObs) { mObs.disconnect(); mObs = null; }
  if (ui.view !== 'month') return;
  const target = ui.mScroll;
  ui.mScroll = null;
  if (target) {
    const today = target.idx === mIdx(new Date()) && !target.month ? document.querySelector('.mday.is-today') : null;
    const sec = document.querySelector(`.msec[data-mi="${target.idx}"]`);
    const behavior = target.smooth && !matchMedia('(prefers-reduced-motion: reduce)').matches ? 'smooth' : 'auto';
    if (today) today.scrollIntoView({ block: 'center', behavior });
    else if (sec) sec.scrollIntoView({ block: 'start', behavior });
  }
  if (!('IntersectionObserver' in window)) return;
  mObs = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) extendMonths(en.target.dataset.sent); });
  }, { rootMargin: '800px 0px' });
  requestAnimationFrame(() => document.querySelectorAll('.msent').forEach(el => mObs && mObs.observe(el)));
}
function extendMonths(side) {
  if (mBusy || ui.view !== 'month' || !ui.mRange) return;
  mBusy = true;
  const wrap = document.querySelector('.mscroll');
  if (side === 'bottom') {
    let h = '';
    for (let i = ui.mRange.to + 1; i <= ui.mRange.to + 3; i++) h += monthBlock(i);
    ui.mRange.to += 3;
    wrap.querySelector('[data-sent="bottom"]').insertAdjacentHTML('beforebegin', h);
  } else {
    let h = '';
    for (let i = ui.mRange.from - 3; i < ui.mRange.from; i++) h += monthBlock(i);
    ui.mRange.from -= 3;
    const before = document.documentElement.scrollHeight;
    wrap.querySelector('[data-sent="top"]').insertAdjacentHTML('afterend', h);
    window.scrollBy(0, document.documentElement.scrollHeight - before);
  }
  requestAnimationFrame(() => { mBusy = false; });
}
let mTick = false;
window.addEventListener('scroll', () => {
  if (ui.view !== 'month' || mTick) return;
  mTick = true;
  requestAnimationFrame(() => {
    mTick = false;
    let cur = null;
    document.querySelectorAll('.msec').forEach(sec => { if (sec.getBoundingClientRect().top <= $('#appbar').offsetHeight + 16) cur = sec; });
    if (!cur) cur = document.querySelector('.msec');
    if (!cur) return;
    const idx = +cur.dataset.mi;
    if (idx !== mIdx(ui.cursor)) { ui.cursor = fromIdx(idx); $('#title').innerHTML = titleHTML(); }
  });
}, { passive: true });

function renderYear() {
  const y = ui.cursor.getFullYear(), t = todayStr();
  let h = '<div class="year">';
  for (let m = 0; m < 12; m++) {
    const last = new Date(y, m + 1, 0, 12);
    h += `<div class="ymonth"><h3><button data-month="${y}-${pad(m + 1)}-01">${MONTHS[m]}</button></h3><div class="yg"><span></span>${DAYS_S.map(x => `<span class="yh">${x.charAt(0)}</span>`).join('')}`;
    for (let rs = startOfWeek(new Date(y, m, 1, 12)); rs <= last; rs = addDays(rs, 7)) {
      const kw = isKidsWeek(rs);
      h += `<span class="yw ${kw ? 'kids' : ''}">${isoWeek(rs)}</span>`;
      for (let i = 0; i < 7; i++) {
        const d = addDays(rs, i), ds = ymd(d);
        if (d.getMonth() !== m) { h += '<span class="yd out"></span>'; continue; }
        const evs = eventsOn(ds, d);
        const cols = [...new Set(evs.map(e => catOf(e.cat).color))].slice(0, 3);
        const hol = holOn(ds), tip = [hol ? hol.name : '', ...evs.map(e => e.title)].filter(Boolean).join(', ');
        h += `<button class="yd ${kw ? 'kids' : ''} ${ds === t ? 'is-today' : ''} ${(hol && hol.red) || dow(d) === 7 ? 'red' : ''}" data-goto="${ds}" title="${esc(tip)}"><span>${d.getDate()}</span><span class="ydots">${cols.map(c => `<i style="--c:${esc(c)}"></i>`).join('')}</span></button>`;
      }
    }
    h += '</div></div>';
  }
  return h + '</div>';
}

function titleHTML() {
  const d = ui.cursor;
  switch (ui.view) {
    case 'day': return `${cap(DAYS[dow(d) - 1].toLowerCase())} ${d.getDate()} ${MONTHS[d.getMonth()]}<small>Vecka ${isoWeek(d)} · ${d.getFullYear()}</small>`;
    case 'week': {
      const ws = startOfWeek(d), we = addDays(ws, 6);
      return `Vecka ${isoWeek(ws)}<small>${ws.getDate()} ${MON_S[ws.getMonth()]} – ${we.getDate()} ${MON_S[we.getMonth()]} ${we.getFullYear()}</small>`;
    }
    case 'month': return `${cap(MONTHS[d.getMonth()])} ${d.getFullYear()}`;
    case 'year': return `${d.getFullYear()}`;
  }
}

function renderFilters() {
  const fb = $('#filterBtn'); if (fb) fb.innerHTML = I.filter + (ui.filter.size ? '<span class="dot"></span>' : '');

function render() {
  if ($('#modal').hidden) applyLook();

  if (Store.status === 'local') { n.hidden = false; n.textContent = 'Förhandsvisning – ändringar sparas bara i den här webbläsaren. När kalendern är kopplad till Google Kalkylark delas den med hela familjen.' + (wx.status === 'fail' && !Object.keys(wx.days).length ? ' Vädret kan inte hämtas här, men visas på henrikwolfner.se.' : ''); }
  else if (Store.status === 'offline') { n.hidden = false; n.textContent = 'Ingen anslutning just nu – du ser senast hämtade kalender. Ändringar kan inte sparas förrän du är online igen.'; }

function setView(v) { if (v !== ui.view || v !== 'month') ui.mRange = null; ui.view = v; ls.set(K.view, v); render(); if (v !== 'month') window.scrollTo(0, 0); }
function step(dir) {
  const d = ui.cursor;
  if (ui.view === 'day') ui.cursor = addDays(d, dir);
  else if (ui.view === 'week') ui.cursor = addDays(d, 7 * dir);
  else if (ui.view === 'month') { const i = mIdx(d) + dir; ensureRange(i); ui.cursor = fromIdx(i); ui.mScroll = { idx: i, smooth: true, month: true }; }
  else ui.cursor = new Date(d.getFullYear() + dir, 0, 1, 12);
  render();
}

/* ---------- Server / lokal lagring ---------- */
function applyData(d) {
  state.events = d && Array.isArray(d.events) ? d.events : [];
  const s = d && d.settings && typeof d.settings === 'object' ? d.settings : {};
  state.settings = Object.assign(clone(DEFAULT_SETTINGS), s);
  if (!Array.isArray(state.settings.categories) || !state.settings.categories.length) state.settings.categories = clone(CATS_DEFAULT);
  if (!Array.isArray(state.settings.people) || !state.settings.people.length) state.settings.people = clone(DEFAULT_SETTINGS.people);
  if (!Array.isArray(state.settings.kids)) state.settings.kids = [];
  if (!state.settings.categories.some(c => c.id === 'fodelsedag')) state.settings.categories.push({ id: 'fodelsedag', name: 'Födelsedagar', color: '#E0559B' });
}

const Store = {
  status: 'local', pin: ls.get(K.pin) || '',
  async call(action, body) {
    let r;
    try {
      r = await fetch(API, { method: 'POST', cache: 'no-store', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action, pin: this.pin }, body || {})) });
    } catch (x) { const e = new Error('Ingen anslutning'); e.code = 'net'; throw e; }
    let j = null;
    try { j = await r.json(); } catch (x) {}
    if (j && j.code === 401) { const e = new Error('pin'); e.code = 401; throw e; }
    if (!j) { const e = new Error('Kalendern svarar inte som den ska. Kontrollera adressen i config.js.'); e.code = 'server'; throw e; }
    if (!j.ok) { const e = new Error(j.error || 'Fel'); e.code = 'server'; throw e; }
    ls.set(K.cache, JSON.stringify(j.data)); ls.set(K.mode, 'remote');
    return j.data;
  },
  async init() {
    if (!API) {
      this.status = 'local';
      const raw = ls.get(K.local);
      if (raw) { try { applyData(JSON.parse(raw)); } catch (e) { seedDemo(); } } else seedDemo();
      return 'ok';
    }
    if (!this.pin) { this.status = 'ok'; return 'pin'; }
    try { applyData(await this.call('load')); this.status = 'ok'; return 'ok'; }
    catch (e) {
      if (e.code === 401) { this.status = 'ok'; return 'pin'; }
      if (e.code === 'net' && ls.get(K.cache)) {
        this.status = 'offline';
        try { applyData(JSON.parse(ls.get(K.cache))); } catch (x) {}
        return 'ok';
      }
      this.status = 'ok';
      this.serverError = e.code === 'net' ? 'Kunde inte nå kalendern. Kontrollera internetanslutningen.' : e.message;
      return 'server';
    }
  },
  saveLocal() { ls.set(K.local, JSON.stringify({ events: state.events, settings: state.settings })); },
  async mutate(localChange, action, body) {
    const snap = clone(state);
    localChange(); render();
    if (this.status === 'local') { this.saveLocal(); return true; }
    try { applyData(await this.call(action, body)); this.status = 'ok'; render(); return true; }
    catch (e) {
      state = snap; render();
      if (e.code === 401) showLock('Skriv koden igen.');
      else toast('Kunde inte spara – kontrollera internetanslutningen');
      return false;
    }
  },
  saveEvent(ev) {
    return this.mutate(() => {
      const i = state.events.findIndex(e => e.id === ev.id);
      if (i >= 0) state.events[i] = ev; else state.events.push(ev);
    }, 'saveEvent', { event: ev });
  },
  deleteEvent(id) { return this.mutate(() => { state.events = state.events.filter(e => e.id !== id); }, 'deleteEvent', { id }); },
  saveSettings(s) { return this.mutate(() => { state.settings = s; }, 'saveSettings', { settings: s }); },
  async refresh() {
    if (this.status === 'local' || document.hidden || !$('#lock').hidden) return;
    try { applyData(await this.call('load')); this.status = 'ok'; render(); }
    catch (e) { if (e.code !== 401 && this.status !== 'offline') { this.status = 'offline'; render(); } }
  }
};

function closeModal() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; document.body.classList.remove('locked'); applyLook(); }

function ask(title, text, buttons) {
  return new Promise(res => {
    const d = $('#dialog');
    d.innerHTML = `<div class="sheet dlg" role="dialog" aria-modal="true"><div class="sheet-h"><h2>${title}</h2></div><div class="sheet-b"><p>${text}</p></div>
      <div class="dlg-f">${buttons.map(([v, l, cls]) => `<button type="button" class="btn ${cls || ''}" data-v="${v}">${l}</button>`).join('')}</div></div>`;
    d.hidden = false;
    const done = v => { d.hidden = true; d.innerHTML = ''; d.onclick = null; res(v); };
    d.onclick = e => { const b = e.target.closest('[data-v]'); if (b) done(b.dataset.v); else if (e.target === d) done('cancel'); };
    d._done = done;
  });
}

function openEditor(id, ctx) {
  const orig = id ? state.events.find(x => x.id === id) : null;
  if (id && !orig) return;

  const ev = orig ? clone(orig) : {
    id: uid(), title: '', cat: (s.categories[0] || {}).id || '', people: [], start: ctx || ymd(ui.cursor), end: '',
    allDay: false, time: '18:00', endTime: '19:00', repeat: { type: 'none', days: [], until: '' }, exceptions: [], note: ''
  };

  openModal(editorHTML(ev, !orig));
  const form = $('#evForm'), fe = form.elements;
  const show = (k, on) => { form.querySelector(`[data-show="${k}"]`).hidden = !on; };
  const sync = () => {
    const r = fe['repeat'].value, wk = WEEKLY.includes(r);
    show('norepeat', r === 'none'); show('timed', !fe['allDay'].checked);
    show('days', wk); show('repeating', r !== 'none');
    if (wk && !form.querySelector('input[name=days]:checked') && fe['start'].value) {
      const box = form.querySelector(`input[name=days][value="${dow(parse(fe['start'].value))}"]`);
      if (box) box.checked = true;
    }
  };
  form.addEventListener('change', x => {
    if (x.target.name === 'cat' && !orig && /semester|ledig/i.test(catOf(x.target.value).name)) fe['allDay'].checked = true;
    sync();
  });
  sync();
  if (!orig) setTimeout(() => fe['title'].focus(), 60);

  form.addEventListener('submit', x => {
    x.preventDefault();
    const title = fe['title'].value.trim();
    const start = fe['start'].value;
    if (!title || !start) return;
    const r = fe['repeat'].value;
    const allDay = fe['allDay'].checked || !fe['time'].value;
    let end = r === 'none' ? fe['end'].value : '';
    if (end && end <= start) end = '';
    const until = fe['until'].value && fe['until'].value >= start ? fe['until'].value : '';
    const days = [...form.querySelectorAll('input[name=days]:checked')].map(i => +i.value);
    const out = Object.assign({}, ev, {
      title, start, end, allDay,
      cat: (form.querySelector('input[name=cat]:checked') || {}).value || ev.cat,
      people: [...form.querySelectorAll('input[name=people]:checked')].map(i => i.value),
      time: allDay ? '' : fe['time'].value,
      endTime: allDay ? '' : fe['endTime'].value,
      note: fe['note'].value.trim(),
      repeat: r === 'none' ? { type: 'none', days: [], until: '' }
        : { type: r, days: WEEKLY.includes(r) ? (days.length ? days : [dow(parse(start))]) : [], until }
    });
    closeModal();
    Store.saveEvent(out).then(ok => ok && toast(orig ? 'Ändringen är sparad' : 'Aktiviteten är tillagd'));
  });

  if (orig) $('#delBtn').onclick = () => onDelete(orig.id, ctx || orig.start);
}

async function onDelete(id, ds) {
  const ev = state.events.find(e => e.id === id);
  if (!ev) return;
  if (!ev.repeat || ev.repeat.type === 'none') {
    const c = await ask('Ta bort aktiviteten?', esc(ev.title), [['del', 'Ta bort', 'danger-solid'], ['cancel', 'Avbryt']]);
    if (c === 'del') { closeModal(); Store.deleteEvent(id).then(ok => ok && toast('Aktiviteten är borttagen')); }
    return;
  }
  const c = await ask('Ta bort återkommande aktivitet', `Vilka tillfällen av <strong>${esc(ev.title)}</strong> vill du ta bort?`, [
    ['one', `Bara ${fmtDate(ds)}`], ['future', 'Från och med detta tillfälle'], ['all', 'Alla tillfällen', 'danger-solid'], ['cancel', 'Avbryt']
  ]);
  if (c === 'cancel') return;
  closeModal();
  const upd = clone(ev);
  if (c === 'one') { upd.exceptions = [...(upd.exceptions || []), ds]; Store.saveEvent(upd); }
  else if (c === 'future' && ds > ev.start) { upd.repeat.until = ymd(addDays(parse(ds), -1)); Store.saveEvent(upd); }
  else Store.deleteEvent(id);
  toast('Borttaget');
}

const catRow = c => `<div class="srow cat-row" data-id="${esc(c.id)}"><input type="color" class="cc" value="${esc(c.color)}" aria-label="Färg"><input class="cn" value="${esc(c.name)}" maxlength="30" placeholder="Namn på kategori" aria-label="Kategorinamn"><button type="button" class="icon rm" aria-label="Ta bort kategori">${I.trash}</button></div>`;

function openSettings() {
  const s = S();
  openModal(`<form class="sheet" id="setForm" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="sheet-h"><h2 id="setTitle">Inställningar</h2><button type="button" class="icon" data-close aria-label="Stäng">${I.x}</button></div>
  <div class="sheet-b">
    <h3>Stil</h3>
    <div class="styles">${STYLES.map(st => `<label class="stylecard"><input type="radio" name="style" value="${st.id}" ${(s.style || 'sticker') === st.id ? 'checked' : ''}><span><b style="font-family:${st.font};font-size:${st.size}px">${st.name}</b><small>${st.desc}</small></span></label>`).join('')}</div>
    <label class="switch"><input type="checkbox" name="seasonal" id="seasonal" ${s.seasonal !== false ? 'checked' : ''}><span></span>Anpassa efter säsong och högtider</label>
    <label class="field"><span>Testa säsong eller högtid <em>(bara på den här enheten)</em></span><select name="seasonPreview" id="seasonPreview"><option value="auto">Som idag</option>
      <optgroup label="Säsonger">${SEASON_KEYS.map(k => `<option value="${k}" ${ui.seasonPreview === k ? 'selected' : ''}>${LOOKS[k].label}</option>`).join('')}</optgroup>
      <optgroup label="Högtider">${Object.keys(LOOKS).filter(k => !SEASON_KEYS.includes(k)).map(k => `<option value="${k}" ${ui.seasonPreview === k ? 'selected' : ''}>${LOOKS[k].label}</option>`).join('')}</optgroup></select></label>
    <h3>Familjen</h3>
    ${s.people.map(p => `<div class="srow"><input type="color" name="pc_${esc(p.id)}" value="${esc(p.color)}" aria-label="Färg för ${esc(p.name)}"><input name="pn_${esc(p.id)}" value="${esc(p.name)}" maxlength="30" aria-label="Namn"><label class="mini"><input type="checkbox" name="kid_${esc(p.id)}" ${s.kids.includes(p.id) ? 'checked' : ''}> Varannan vecka</label></div>`).join('')}
    <label class="field"><span>De som bor här varannan vecka är hos er</span><select name="kidsWeeks"><option value="even" ${s.kidsWeeks !== 'odd' ? 'selected' : ''}>Jämna veckor</option><option value="odd" ${s.kidsWeeks === 'odd' ? 'selected' : ''}>Udda veckor</option></select></label>
    <h3>Väder</h3>
    <label class="field"><span>Ort för väderprognos</span><input name="wxPlace" id="wxPlace" value="${esc((s.weather || {}).place || '')}" maxlength="60" placeholder="T.ex. Stockholm"></label>
    <h3>Kategorier</h3>
    <div id="catRows" style="display:flex;flex-direction:column;gap:8px">${s.categories.map(catRow).join('')}</div>
    <button type="button" class="btn" id="addCat" style="align-self:flex-start">+ Ny kategori</button>
    ${Store.status !== 'local' ? '<h3>Den här enheten</h3><button type="button" class="btn" id="logout" style="align-self:flex-start">Logga ut</button>' : ''}
    <p class="ver">Version ${APP_VERSION}</p>
  </div>
  <div class="sheet-f"><span class="spacer"></span><button type="button" class="btn" data-close>Avbryt</button><button class="btn primary">Spara</button></div>
  </form>`);
  const form = $('#setForm'), rows = form.querySelector('#catRows');
  form.addEventListener('change', e => {
    const nm = e.target.name;
    if (nm === 'seasonPreview') ui.seasonPreview = e.target.value;
    if (nm === 'style' || nm === 'seasonal' || nm === 'seasonPreview') applyLook({ style: (form.querySelector('input[name=style]:checked') || {}).value, seasonal: form.elements['seasonal'].checked });
  });
  form.querySelector('#addCat').onclick = () => { rows.insertAdjacentHTML('beforeend', catRow({ id: '', name: '', color: '#0EA5E9' })); rows.lastElementChild.querySelector('.cn').focus(); };
  rows.addEventListener('click', e => { const b = e.target.closest('.rm'); if (b && rows.children.length > 1) b.closest('.cat-row').remove(); });
  const lo = form.querySelector('#logout');
  if (lo) lo.onclick = () => { ls.del(K.pin); ls.del(K.cache); location.reload(); };
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const fe = form.elements, n = clone(s);
    const place = fe['wxPlace'].value.trim();
    if (place && place !== ((s.weather || {}).place || '')) {
      try {
        const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=sv&name=' + encodeURIComponent(place));
        const g = ((await r.json()).results || [])[0];
        if (!g) throw new Error('none');
        n.weather = { place: g.name, lat: +g.latitude.toFixed(3), lon: +g.longitude.toFixed(3) };
      } catch (err) { toast('Hittade inte orten – vädret visas fortfarande för ' + ((s.weather || {}).place || 'tidigare ort')); }
    }
    n.people.forEach(p => { p.name = fe['pn_' + p.id].value.trim() || p.name; p.color = fe['pc_' + p.id].value; });
    n.kids = n.people.filter(p => fe['kid_' + p.id].checked).map(p => p.id);
    n.kidsWeeks = fe['kidsWeeks'].value;
    n.style = (form.querySelector('input[name=style]:checked') || {}).value || 'sticker';
    n.seasonal = fe['seasonal'].checked;
    n.categories = [...rows.querySelectorAll('.cat-row')].map(r => ({ id: r.dataset.id || uid(), name: r.querySelector('.cn').value.trim(), color: r.querySelector('.cc').value })).filter(c => c.name);
    if (!n.categories.length) n.categories = clone(CATS_DEFAULT);
    closeModal();
    Store.saveSettings(n).then(ok => { if (ok) { toast('Inställningarna är sparade'); wxFetch(); } });
  });
}

/* ---------- Lås (familjekod) ---------- */
function showLock(msg) {
  $('#lock').hidden = false; $('#lockErr').textContent = msg || '';
  const i = $('#pinInput'); i.value = ''; setTimeout(() => i.focus(), 60);
}
$('#lockForm').addEventListener('submit', async e => {
  e.preventDefault();
  Store.pin = $('#pinInput').value.trim();
  try { applyData(await Store.call('load')); ls.set(K.pin, Store.pin); Store.status = 'ok'; $('#lock').hidden = true; render(); wxFetch(); }
  catch (err) { showLock(err.code === 401 ? 'Fel kod, försök igen.' : err.code === 'net' ? 'Kunde inte nå kalendern.' : err.message); }
});

let tt;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }

/* ---------- Händelser ---------- */
$('#prev').innerHTML = I.prev; $('#next').innerHTML = I.next;
$('#settingsBtn').innerHTML = I.sliders; $('#fab').innerHTML = I.plus.replace('width="20" height="20"', 'width="26" height="26"');
$('#prev').onclick = () => step(-1);
$('#next').onclick = () => step(1);
$('#todayBtn').onclick = () => { ui.cursor = noon(new Date()); if (ui.view === 'month') { ensureRange(mIdx(ui.cursor)); ui.mScroll = { idx: mIdx(ui.cursor), smooth: true }; } render(); };
$('#addBtn').onclick = $('#fab').onclick = () => openEditor(null, ui.view === 'day' ? ymd(ui.cursor) : todayStr());
$('#settingsBtn').onclick = openSettings;
$('#filterBtn').onclick = () => {
  const bar = $('#appbar'), open = !bar.classList.contains('show-filters');
  bar.classList.toggle('show-filters', open);
  $('#filterBtn').setAttribute('aria-expanded', open);
  $('#filterBtn').setAttribute('aria-label', open ? 'Dölj filter' : 'Visa filter');
};
if ('IntersectionObserver' in window) {
  new IntersectionObserver(([en]) => {
    const bar = $('#appbar');
    bar.classList.toggle('condensed', !en.isIntersecting);
    if (en.isIntersecting) { bar.classList.remove('show-filters'); $('#filterBtn').setAttribute('aria-expanded', 'false'); }
  }).observe($('#topSentinel'));
}
if ('ResizeObserver' in window) {
  new ResizeObserver(() => document.documentElement.style.setProperty('--bar-h', $('#appbar').offsetHeight + 'px')).observe($('#appbar'));
}
document.querySelector('.seg').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) setView(b.dataset.view); });
$('#filters').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  const f = b.dataset.f;
  if (!f) ui.filter.clear(); else ui.filter.has(f) ? ui.filter.delete(f) : ui.filter.add(f);
  render();
});
$('#view').addEventListener('click', e => {
  const ev = e.target.closest('[data-id]'); if (ev) { openEditor(ev.dataset.id, ev.dataset.date); return; }
  const add = e.target.closest('[data-add]'); if (add) { openEditor(null, add.dataset.add); return; }
  const mo = e.target.closest('[data-month]'); if (mo) { ui.cursor = parse(mo.dataset.month); setView('month'); return; }
  const go = e.target.closest('[data-goto]'); if (go) { ui.cursor = parse(go.dataset.goto); setView('day'); }
});
document.addEventListener('keydown', e => {
  if (!$('#dialog').hidden) { if (e.key === 'Escape') $('#dialog')._done('cancel'); return; }
  if (!$('#modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
  if (!$('#lock').hidden || /input|textarea|select/i.test(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { Store.refresh(); wxFetch(); } });

(async () => {
  const r = await Store.init();
  render();
  if (r === 'pin') showLock();
  if (r === 'server') showLock(Store.serverError);
  wxFetch();
  setInterval(() => { Store.refresh(); wxFetch(); }, 60000);
})();
})();
</script>
